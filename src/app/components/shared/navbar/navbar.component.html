<style>
    * {
        box-sizing: border-box;
    }

    nav {
        width: 100%;
        min-height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 32px;

        background-color: rgba(11, 18, 32, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);

        box-shadow: 0 3px 16px rgba(11, 18, 32, 0.15);
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);

        font-family: Arial, sans-serif;

        position: fixed;
        top: 0;
        left: 0;
        z-index: 100;
    }

    .nav-logo {
        display: flex;
        align-items: center;
        cursor: pointer;
    }

    .nav-logo h3 {
        display: flex;
        align-items: baseline;
        margin: 0;
        color: #FFFFFF;
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    .nav-logo h3 span {
        color: #94A3B8;
    }

    .nav-logo h3 small {
        margin-left: 4px;
        color: #94A3B8;
        font-size: 14px;
        font-weight: 500;
    }

    .nav-menu {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    nav a {
        position: relative;
        padding: 9px 16px;
        color: #94A3B8;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        border-radius: 8px;
        transition: 0.2s ease;
    }

    nav a:hover {
        color: #FFFFFF;
        background-color: rgba(226, 232, 240, 0.1);
    }

    nav a.active {
        color: #0B1220 !important;
        background-color: #E2E8F0;
        font-weight: bold;
    }

    /* --- Botón hamburguesa (solo móvil) --- */
    .nav-toggle {
        display: none;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
        width: 34px;
        height: 34px;
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 0;
    }

    .nav-toggle span {
        display: block;
        width: 100%;
        height: 2px;
        background-color: #FFFFFF;
        border-radius: 2px;
        transition: 0.25s ease;
    }

    .nav-toggle.abierto span:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
    }

    .nav-toggle.abierto span:nth-child(2) {
        opacity: 0;
    }

    .nav-toggle.abierto span:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {

        nav {
            padding: 12px 20px;
        }

        .nav-toggle {
            display: flex;
        }

        .nav-menu {
            position: fixed;
            top: 68px;
            left: 0;
            width: 100%;

            flex-direction: column;
            align-items: stretch;
            gap: 4px;

            background-color: rgba(11, 18, 32, 0.97);
            backdrop-filter: blur(10px);

            padding: 12px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.15);

            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.25s ease, opacity 0.2s ease;
        }

        .nav-menu.abierto {
            max-height: 300px;
            opacity: 1;
        }

        nav a {
            text-align: center;
            padding: 12px 16px;
        }
    }
</style>

<nav>
    <div class="nav-logo" routerLink="/">
        <h3>Finanz<span>App</span> <small>Lite</small></h3>
    </div>

    <button
        class="nav-toggle"
        [class.abierto]="menuAbierto"
        (click)="menuAbierto = !menuAbierto"
        type="button"
        aria-label="Abrir menú"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="nav-menu" [class.abierto]="menuAbierto">
        <a href="" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="menuAbierto = false">Inicio</a>
        <a href="" routerLink="/operaciones" routerLinkActive="active" (click)="menuAbierto = false">Procesos</a>
        <a href="" routerLink="/dashboard" routerLinkActive="active" (click)="menuAbierto = false">DashBoard</a>
    </div>
</nav>
